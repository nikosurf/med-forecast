<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Houle Med</title>
<meta name="theme-color" content="#E6EDEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1C23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Houle Med">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E6EDEB;
  --surface: #F4F7F6;
  --ink: #17303A;
  --ink-soft: #4E6670;
  --line: #C9D6D4;
  --r0: #D5E4E5;
  --r1: #9CCAD0;
  --r2: #4FA2AF;
  --r3: #136F80;
  --r4: #073F50;
  --warn: #9A4A2E;
  --focus: #136F80;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1C23;
    --surface: #152730;
    --ink: #E1EBEC;
    --ink-soft: #93AAB1;
    --line: #26414C;
    --r0: #1E3640;
    --r1: #2D6672;
    --r2: #3F95A3;
    --r3: #6FC3CF;
    --r4: #B5E8EE;
    --warn: #E39A7C;
    --focus: #6FC3CF;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Archivo", system-ui, sans-serif;
  font-variation-settings: "wdth" 100;
  font-size: 16px;
  line-height: 1.45;
  padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 32px);
}
main { max-width: 640px; margin: 0 auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

header.top {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 18px 0 8px;
}
.brand { font-weight: 800; font-variation-settings: "wdth" 70; font-size: 20px; letter-spacing: .01em; }
.updated { color: var(--ink-soft); font-size: 13px; }

/* La phrase qui répond à la question du matin */
.verdict {
  margin: 14px 0 26px;
  font-variation-settings: "wdth" 72;
  font-weight: 700;
  font-size: clamp(30px, 8.4vw, 44px);
  line-height: 1.04;
  letter-spacing: -.005em;
}
.verdict small {
  display: block; margin-top: 10px;
  font-variation-settings: "wdth" 100; font-weight: 400;
  font-size: 15px; line-height: 1.4; color: var(--ink-soft);
}

.spot { padding: 18px 0 20px; border-top: 1px solid var(--line); }
.spot-head {
  display: flex; justify-content: space-between; align-items: baseline;
  width: 100%; background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
}
.spot-name { font-weight: 700; font-size: 19px; font-variation-settings: "wdth" 85; }
.spot-area { color: var(--ink-soft); font-size: 13px; }
.chev { color: var(--ink-soft); font-size: 13px; }

/* Bande des jours : hauteur = taille, profondeur de bleu = note, hachures = modèles en désaccord */
.days { display: grid; grid-template-columns: repeat(var(--n, 6), 1fr); gap: 6px; margin-top: 12px; }
.day { display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-width: 0; }
.bar-wrap { height: 70px; display: flex; align-items: flex-end; background: var(--surface); border-radius: 3px; overflow: hidden; }
.bar { width: 100%; border-radius: 2px 2px 0 0; min-height: 3px; }
.bar.low { background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgba(255,255,255,.55) 4px 6px); }
@media (prefers-color-scheme: dark) { .bar.low { background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgba(14,28,35,.6) 4px 6px); } }
.d-h { font-weight: 700; font-variation-settings: "wdth" 70; font-size: 17px; line-height: 1; }
.d-lbl { font-size: 12px; color: var(--ink-soft); }
.d-wind { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-wind.bad { color: var(--warn); }
.trend { font-size: 11px; color: var(--ink-soft); }

.day { cursor: pointer; border: 0; background: none; padding: 4px 2px 6px; text-align: left; border-radius: 6px; }
.day[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 -3px 0 var(--ink); }
.d-T { font-size: 12px; color: var(--ink); }

.hours {
  display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 0; padding: 2px 16px 10px;
  scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.hours::-webkit-scrollbar { display: none; }
.hour {
  flex: 0 0 84px; scroll-snap-align: start; background: var(--surface); border-radius: 8px;
  padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-soft);
  border-top: 4px solid var(--r0);
}
.hour.best { outline: 2px solid var(--ink); outline-offset: -2px; }
.h-t { font-weight: 600; color: var(--ink); font-size: 13px; }
.h-h { font-weight: 700; font-variation-settings: "wdth" 70; font-size: 22px; line-height: 1.05; color: var(--ink); }
.h-r { font-size: 11px; }
.h-T { font-weight: 600; color: var(--ink); font-size: 13px; }
.h-w { white-space: nowrap; }
.h-w.bad { color: var(--warn); }
.arr { display: inline-block; width: 11px; text-align: center; }
.day-note { margin-top: 6px; font-size: 13px; color: var(--ink-soft); }

.empty { padding: 40px 0; color: var(--ink-soft); }
footer { margin-top: 28px; font-size: 12px; color: var(--ink-soft); }

</style>
</head>
<body>
<main>
  <header class="top">
    <span class="brand">Houle Med</span>
    <span class="updated" id="updated"></span>
  </header>
  <p class="verdict" id="verdict">Chargement des prévisions…</p>
  <section id="spots"></section>
  <footer id="footer"></footer>
</main>

<script>
const RCOL = ["var(--r0)", "var(--r1)", "var(--r2)", "var(--r3)", "var(--r4)"];
const DAYS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
const DAYS_LONG = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const POINTS = ["N", "NE", "E", "SE", "S", "SO", "O", "NO"];
const WQ = {
  glassy: "pas de vent", offshore: "offshore", offshore_fort: "offshore fort",
  faible: "vent faible", side: "side-shore", onshore: "onshore"
};

const m = v => v == null ? "–" : v.toFixed(1).replace(".", ",") + " m";
const card = d => d == null ? "" : POINTS[Math.round(d / 45) % 8];
const dateOf = s => new Date(s + "T12:00:00");
function dayLabel(s, long) {
  const d = dateOf(s), today = new Date(); today.setHours(12, 0, 0, 0);
  const diff = Math.round((d - today) / 864e5);
  if (diff === 0) return "aujourd'hui";
  if (diff === 1) return "demain";
  return (long ? DAYS_LONG : DAYS)[d.getDay()] + (long ? "" : " " + d.getDate());
}
const shortDay = s => { const l = dayLabel(s, false); return l === "aujourd'hui" ? "auj." : l === "demain" ? "demain" : l; };
const confWord = c => c === "forte" ? "modèles d'accord" : c === "moyenne" ? "modèles assez proches" : "modèles en désaccord";

async function load() {
  try {
    const r = await fetch("data/latest.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    document.getElementById("verdict").innerHTML =
      "Pas encore de prévisions.<small>Les premières données arrivent après le premier passage de la collecte automatique.</small>";
  }
}

function render(data) {
  document.getElementById("updated").textContent = "maj " + data.generated_local;
  const spots = data.spots.filter(s => s.days && s.days.length);

  // Meilleure fenêtre tous spots confondus (en privilégiant les prévisions fiables)
  let best = null;
  for (const s of spots) for (const d of s.days) {
    const w = d.conf === "forte" ? 1 : d.conf === "moyenne" ? .85 : .6;
    const score = d.rating * w + (d.h || 0) * .1;
    if (d.rating > 0 && (!best || score > best.score)) best = { s, d, score };
  }
  const v = document.getElementById("verdict");
  if (best) {
    const { s, d } = best;
    const hh = t => +t.slice(0, 2) + "h";
    const when = d.window ? `de ${hh(d.window[0])} à ${hh(d.window[1])}` : `vers ${hh(d.best_hour)}`;
    v.innerHTML = `${s.name}, ${dayLabel(d.date, true)} ${when}, ${m(d.h)}.` +
      `<small>${d.T ? Math.round(d.T) + " s de période, " : ""}houle de ${card(d.dir)}, ${WQ[d.wq] || "vent inconnu"}. ` +
      `Fourchette ${m(d.h_min)} à ${m(d.h_max)} selon les modèles, ${confWord(d.conf)}.</small>`;
  } else {
    v.innerHTML = "Rien de surfable sur les six prochains jours." +
      "<small>Aucun spot ne dépasse le seuil de taille avec un vent correct.</small>";
  }

  const root = document.getElementById("spots");
  root.innerHTML = "";
  spots.forEach(s => root.appendChild(spotEl(s)));
  if (!spots.length) root.innerHTML = `<p class="empty">Aucun modèle n'a répondu lors du dernier passage.</p>`;

  const miss = data.unavailable_models && data.unavailable_models.length
    ? ` Indisponibles au dernier passage : ${data.unavailable_models.join(", ")}.` : "";
  document.getElementById("footer").textContent =
    "Taille estimée au spot à partir de la houle au large : hauteur, période et orientation. " +
    "Bande hachurée : les modèles divergent, prévision peu fiable. Sous chaque jour : vent en km/h et sa provenance." + miss;
}

function spotEl(s) {
  const el = document.createElement("article");
  el.className = "spot";
  const maxH = Math.max(1.2, ...s.days.map(d => d.h_max || 0));
  el.innerHTML = `
    <div class="spot-head">
      <span><span class="spot-name">${s.name}</span> <span class="spot-area">${s.area || ""}</span></span>
    </div>
    <div class="days" role="group" aria-label="Choisir le jour" style="--n:${s.days.length}">${s.days.map((d, i) => `
      <button class="day" data-d="${d.date}" aria-pressed="${i === 0}"
        aria-label="${dayLabel(d.date, true)} : ${m(d.h)}, ${d.T ?? "–"} secondes, ${confWord(d.conf)}">
        <div class="bar-wrap"><div class="bar ${d.conf === "faible" ? "low" : ""}"
          style="height:${Math.max(4, ((d.h || 0) / maxH) * 100)}%;background-color:${RCOL[Math.min(4, d.rating)]}"></div></div>
        <span class="d-h">${d.h == null ? "–" : d.h.toFixed(1).replace(".", ",")}</span>
        <span class="d-T">${d.T == null ? "–" : Math.round(d.T) + " s"}</span>
        <span class="d-lbl">${shortDay(d.date)}</span>
        <span class="d-wind ${d.wq === "onshore" ? "bad" : ""}">${d.wind ?? "–"} ${card(d.wdir)}</span>
        ${d.trend && d.trend !== "stable" ? `<span class="trend">${d.trend === "hausse" ? "en hausse" : "en baisse"}</span>` : ""}
      </button>`).join("")}
    </div>
    <div class="hours" aria-label="Détail heure par heure"></div>
    <p class="day-note"></p>`;
  const show = date => {
    el.querySelectorAll(".day").forEach(b => b.setAttribute("aria-pressed", b.dataset.d === date));
    renderHours(s, el, date);
  };
  el.querySelectorAll(".day").forEach(b => b.addEventListener("click", () => show(b.dataset.d)));
  show(s.days[0].date);
  return el;
}

const arrow = deg => deg == null ? "" :
  `<span class="arr" style="transform:rotate(${deg}deg)" aria-hidden="true">↓</span>`;

function renderHours(s, el, date) {
  const now = new Date();
  const nowKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}T${String(now.getHours()).padStart(2, "0")}:00`;
  const hours = s.hourly.filter(h => h.t.startsWith(date) && +h.t.slice(11, 13) >= 5 && +h.t.slice(11, 13) <= 21 && h.t >= nowKey);
  const day = s.days.find(d => d.date === date);
  const box = el.querySelector(".hours");
  box.innerHTML = hours.map(h => `
    <div class="hour ${day && h.t.slice(11, 16) === day.best_hour ? "best" : ""}" style="border-top-color:${RCOL[Math.min(4, h.rating)]}">
      <span class="h-t">${+h.t.slice(11, 13)}h</span>
      <span class="h-h">${h.h == null ? "–" : h.h.toFixed(1).replace(".", ",")}</span>
      <span class="h-r">${h.h_min == null ? "" : h.h_min.toFixed(1).replace(".", ",") + "–" + h.h_max.toFixed(1).replace(".", ",")} m</span>
      <span class="h-T">${h.T == null ? "–" : Math.round(h.T) + " s"}</span>
      <span>${arrow(h.dir)} ${card(h.dir)}</span>
      <span class="h-w ${h.wq === "onshore" ? "bad" : ""}">${arrow(h.wdir)} ${h.wind ?? "–"} km/h</span>
      <span>${WQ[h.wq] || ""}</span>
    </div>`).join("") || `<p class="day-note">Plus d'heures de jour à afficher.</p>`;
  box.scrollLeft = 0;
  el.querySelector(".day-note").textContent = day
    ? `Meilleur créneau ${day.window && day.window[0] !== day.window[1] ? day.window.map(t => +t.slice(0, 2) + "h").join("–") : +day.best_hour.slice(0, 2) + "h"}, ${confWord(day.conf)}. Fais défiler les heures vers la droite.`
    : "";
}

load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
